# Copy to .github/workflows/release.yml in a plugin repository that ships a compiled program.
# Push a build tag (v* by default, for example v1.0.0-build): this builds the program for the four platforms shellcraft supports, publishes the
# archives as release assets and prints the [[binary]] blocks to paste into shellcraft-plugin.toml.
# This example builds a Rust crate whose binary is named BIN; adapt the build step for Go or others.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BIN: my-plugin          # the executable's name

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: archive and checksum
        run: |
          mkdir dist
          tar -C target/${{ matrix.target }}/release -czf dist/$BIN-${{ matrix.target }}.tar.gz $BIN
          (sha256sum dist/$BIN-${{ matrix.target }}.tar.gz 2>/dev/null || shasum -a 256 dist/$BIN-${{ matrix.target }}.tar.gz) | cut -d' ' -f1 > dist/$BIN-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: the [[binary]] blocks for shellcraft-plugin.toml
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          for sum in dist/*.sha256; do
            target=$(basename "$sum" .sha256); target=${target#"$BIN-"}
            {
              echo "[[binary]]"; echo "name = \"$BIN\""; echo "target = \"$target\""
              echo "url = \"$base/$BIN-$target.tar.gz\""; echo "sha256 = \"$(cat "$sum")\""
              echo "archive = \"tar.gz\""; echo "member = \"$BIN\""; echo
            } >> dist/binary-blocks.toml
          done
          cat dist/binary-blocks.toml | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
